<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Gaming Hub | 5-Game Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #03030a;
            --card-bg: rgba(5, 5, 12, 0.7);
            --text-color: #ffffff;
            
            /* Dynamic Theme Variables - Controlled by JavaScript */
            --game-accent: #00f0ff;
            --game-accent-glow: rgba(0, 240, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Stacks the isolated title above the dashboard layout */
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }

        /* Ambient Wallpaper Backdrop */
        .bg-wallpaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(2px) brightness(0.75);
            transform: scale(1.06);
            z-index: -3;
            transition: background-image 0.6s ease-in-out;
            pointer-events: none;
        }

        /* Lightning Animation Trigger Layer */
        @keyframes lightning-strike {
            0%, 92%, 94%, 100% { opacity: 0; }
            93% { opacity: 0.2; background: #fff; }
            93.5% { opacity: 0.35; background: var(--game-accent); }
            95% { opacity: 0.1; background: #fff; }
        }

        .lightning-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -2;
        }
        
        .lightning-strike-active {
            animation: lightning-strike 0.5s ease-out forwards;
        }

        /* --- SEPARATE NAME HIGHLIGHT ON TOP --- */
        .top-banner-name {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ffffff;
            margin-bottom: 30px;
            position: relative;
            text-align: center;
            transition: text-shadow 0.5s ease;
            /* Creates a dramatic neon aura that pulls colors from the active theme */
            text-shadow: 0 0 10px #fff, 
                         0 0 20px var(--game-accent), 
                         0 0 40px var(--game-accent), 
                         0 0 80px var(--game-accent);
            animation: text-pulse 2s infinite alternate;
        }

        /* Gentle pulse animation mimicking a live neon electrical tube */
        @keyframes text-pulse {
            0% {
                transform: scale(1);
                opacity: 0.95;
            }
            100% {
                transform: scale(1.02);
                opacity: 1;
                filter: brightness(1.2);
            }
        }

        /* Master Dashboard Window Grid */
        .dashboard-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 850px;
            border-radius: 24px;
            display: grid;
            grid-template-columns: 220px 1fr;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid var(--game-accent);
            box-shadow: 0 0 35px var(--game-accent-glow), 
                        inset 0 0 20px rgba(255, 255, 255, 0.02);
            overflow: hidden;
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        /* Left Hand Game Selection Dock */
        .sidebar-dock {
            background: rgba(0, 0, 0, 0.4);
            padding: 25px 15px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dock-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #65658a;
            margin-bottom: 15px;
            padding-left: 10px;
            font-weight: 800;
        }

        .game-btn {
            background: transparent;
            border: none;
            color: #8a8ab0;
            padding: 14px 15px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            text-align: left;
            cursor: pointer;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .game-btn i {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .game-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
            transform: translateX(4px);
        }

        /* Active Dynamic Side Rail Selectors */
        .game-btn.active {
            color: #fff;
            background: var(--game-accent);
            box-shadow: 0 0 15px var(--game-accent-glow);
        }
        
        .game-btn.active[data-game="pubg"], 
        .game-btn.active[data-game="cod"] {
            color: #000 !important;
        }

        /* Right Hand Statistics & Identity Core Panel */
        .main-display {
            padding: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Avatar Container Setup */
        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 0 20px var(--game-accent-glow);
            transition: box-shadow 0.5s ease;
        }

        .uid-tag {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            border: 1px solid var(--game-accent);
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }

        .uid-tag:hover {
            box-shadow: 0 0 15px var(--game-accent);
            transform: scale(1.03);
        }

        .uid-tag i { margin-left: 10px; font-size: 0.8rem; opacity: 0.7; }

        /* Performance Metric Card Grids */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 16px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--game-accent);
            background: rgba(0, 0, 0, 0.45);
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            display: block;
            margin-bottom: 4px;
            text-shadow: 0 0 8px var(--game-accent-glow);
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9292bd;
        }

        /* Hyperlink Hub Blocks */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--game-accent);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.03);
            transform: scale(1.01);
        }

        /* Universal Feedback Toast Component */
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #000;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 50px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        .toast.show { bottom: 35px; }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .top-banner-name { font-size: 2.5rem; margin-bottom: 20px; }
            .dashboard-container { grid-template-columns: 1fr; }
            .sidebar-dock { 
                flex-direction: row; 
                overflow-x: auto; 
                padding: 15px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }
            .game-btn { white-space: nowrap; padding: 10px 15px; }
            .dock-title { display: none; }
        }

        @media (max-width: 520px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        // UI Core Panel Switch Execution Pipeline Function
        function switchGame(gameKey) {
            // Update Active Elements Class Indicators
            document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-game="${gameKey}"]`).classList.add('active');

            const data = gameData[gameKey];
            
            // Trigger Dynamic Custom Animated Flash Overlay Effect Sequence
            const flashSheet = document.getElementById('lightningSheet');
            flashSheet.classList.remove('lightning-strike-active');
            void flashSheet.offsetWidth; // Force Reflow engine trigger layout reset mechanism
            flashSheet.classList.add('lightning-strike-active');

            // Apply Theme Accent Colors Properties adjustments
            document.documentElement.style.setProperty('--game-accent', data.accent);
            document.documentElement.style.setProperty('--game-accent-glow', data.glow);

            // Update Graphical Background Wallpapers
            document.getElementById('bgWallpaper').style.backgroundImage = `url('${data.wallpaper}')`;

            // Update Isolated Top Header Name along with inner stats fields
            document.getElementById('mainGamerTag').innerText = data.name;
            document.getElementById('uidDisplay').innerText = data.uid;
            document.getElementById('gameAvatar').src = data.avatar;

            // Swap values data fields strings
            document.getElementById('stat1').innerText = data.stats[0];
            document.getElementById('stat2').innerText = data.stats[1];
            document.getElementById('stat3').innerText = data.stats[2];

            // Swap matching dynamic descriptions labels tags indicators 
            document.getElementById('lbl1').innerText = data.labels[0];
            document.getElementById('lbl2').innerText = data.labels[1];
            document.getElementById('lbl3').innerText = data.labels[2];
        }

        // Clipboards Copy Wrapper Command String Execution
        function copyUID() {
            const uidText = document.getElementById('uidDisplay').innerText;
            navigator.clipboard.writeText(uidText).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                
                const icon = document.querySelector('.uid-tag i');
                icon.className = 'fas fa-check';
                
                setTimeout(() => {
                    toast.classList.remove('show');
                    icon.className = 'far fa-copy';
                }, 1800);
            });
        }

        // Initialize Application State Context on primary asset loader complete sequence
        switchGame('freefire');
    </script>
